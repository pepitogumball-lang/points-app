name: Diagnose Runner

on:
  push:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
    - name: Print environment
      run: |
        echo "GitHub Runner Diagnostics"
        echo "=========================="
        echo "OS: $(uname -a)"
        echo "Node: $(node --version)"
        echo "npm: $(npm --version)"
        echo "Git: $(git --version)"
        echo "PWD: $(pwd)"
        echo "USER: $(whoami)"
        echo "=========================="
        env | sort
