<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Points — Contador de puntos en tiempo real" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Points" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <title>Points</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Script de inicialización: OBLIGA a usar variables de Supabase -->
    <script>
      (function() {
        const url = '%VITE_SUPABASE_URL%';
        const key = '%VITE_SUPABASE_KEY%';
        
        // Si las variables son placeholders, lanzar error
        if (!url || url.includes('placeholder') || !key || key.includes('placeholder')) {
          console.error('[Points] FATAL: Supabase env vars not configured. URL:', url, 'KEY:', key);
          document.body.innerHTML = '<div style="background:#020617;color:#f87171;font-family:monospace;padding:2rem;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center"><div><h1>⚠️ Configuration Error</h1><p>Supabase credentials not found.</p><p>Contact the administrator.</p></div></div>';
          throw new Error('Supabase configuration missing');
        }
        
        // Inyectar en window de forma global
        window.__SUPABASE_URL__ = url;
        window.__SUPABASE_KEY__ = key;
        console.log('[Points] Supabase configured successfully');
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"
    ></script>
  </body>
</html>
